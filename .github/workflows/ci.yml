name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        command: [check, test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ${{ matrix.command }}
        run: |
          if [ "${{ matrix.command }}" = "test" ]; then
            npm run test -- --run
          else
            npm run ${{ matrix.command }}
          fi